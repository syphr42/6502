MEMORY {
    ZP:         start = $0000, size = $0100, type = rw, file = "";
    DATA:       start = $0200, size = $0100, type = rw, file = "";
    IO_BUFFERS:	start = $0300, size = $0100, type = rw, file = "";
    RAM:        start = $0000, size = $4000, type = rw, file = "";
    ROM:        start = $8000, size = $7FFA, type = ro, fill = yes;
    RESETVEC:   start = $FFFA, size = 6, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load=ZP, type=rw;
    DATA: load=DATA, type=rw;
    CODE: load=ROM, type=ro;
    VECTORS: load=RESETVEC, type=ro;
}
